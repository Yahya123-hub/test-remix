<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Internal Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    .empty-state { border: 1px dashed #ccc; border-radius: 8px; padding: 32px; text-align: center; color: #888; margin: 24px 0; }
    form { display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
    input, textarea { padding: 8px; font-size: 1rem; }
    button { padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Internal Tools</h1>
  <p>Starting point for internal experiments.</p>

  <section class="empty-state" id="results-empty-state">
    No results yet.
  </section>

  <h2>Contact us</h2>
  <form id="contact-form">
    <input type="text" name="name" placeholder="Name" required />
    <input type="email" name="email" placeholder="Email" required />
    <textarea name="message" placeholder="Message" rows="4" required></textarea>
    <button type="submit">Send</button>
  </form>
  <p id="contact-status"></p>

  <script>
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const body = Object.fromEntries(new FormData(form));
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const status = document.getElementById('contact-status');
      status.textContent = res.ok ? 'Thanks, message received.' : 'Something went wrong.';
    });
  </script>
</body>
</html>
